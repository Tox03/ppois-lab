name: "Лабораторная работа №2: Завод автодеталей"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  test-python-lab2:
    name: "Тестирование, анализ покрытия и сборка ЛР №2"
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8 pyinstaller

      - name: Lint with flake8
        run: |
          flake8 --config=lab2/.flake8 lab2

      - name: Run Unit Tests and Verify Coverage (>=90%)
        run: |
          python -m coverage run --source=lab2/plant,lab2/cli,lab2/main -m unittest discover -s lab2/tests -p "test_*.py" -v
          python -m coverage report --fail-under=90

      - name: Build Standalone Executable (.exe)
        run: |
          pyinstaller --name ppois-lab2 --onefile --paths lab2 lab2/main.py --distpath lab2/dist

      - name: Upload Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ppois_lab2_windows
          path: lab2/dist/ppois-lab2.exe
