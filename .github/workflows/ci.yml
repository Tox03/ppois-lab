name: "Лабораторная работа №3: Социальная сеть"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  test-python-lab3:
    name: "Тестирование, анализ покрытия и сборка ЛР №3"
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8 pyinstaller

      - name: Lint with flake8
        run: |
          flake8 --config=lab3/.flake8 lab3

      - name: Run Unit Tests and Verify Coverage (>=90%)
        run: |
          python -m coverage run --source=lab3/network,lab3/cli -m unittest discover -s lab3/tests -p "test_*.py" -v
          python -m coverage report --fail-under=90

      - name: Build Standalone Executable (.exe)
        run: |
          pyinstaller --name ppois-lab3 --onefile --paths . lab3/main.py --distpath lab3/dist

      - name: Upload Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ppois_lab3_windows
          path: lab3/dist/ppois-lab3.exe
